services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bazar_solidario
      MYSQL_USER: bazar
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente ou .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no ambiente ou .env}
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u bazar -D bazar_solidario -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
  web:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: bazar_solidario
      DB_USER: bazar
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - ./:/app:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dados_mysql:
